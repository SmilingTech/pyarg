openapi: 3.2.1
info:
  title: Template
  description: OpenAPI template
  version: 0.1.0
  contact:
    name: Your Name
    email: your.email@email.com
  license:
    name: License Name
    identifier: License Identifier
externalDocs:
  description: Full documentation
  url: https://example.com/docs
servers:
  - url: https://{env}.example.com/v1
    description: Server description
    variables:
      env:
        default: api
        enum: [dev, staging, api]
tags:
  - name: health
    description: API status
security:
  - bearerAuth: []
components:
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
        message:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
  responses:
    BadRequest:
      description: Requisição inválida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Não autenticado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Não encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Internal Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
paths:
  /health:
    get:
      tags: [health]
      summary: Health Check
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Running API
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok, fail]
                  message:
                    type: [string, "null"]
        "500":
          $ref: "#/components/responses/InternalError"
