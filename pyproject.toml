# Build system.
[build-system]
requires = ["hatchling>=1.27", "hatch-vcs"]
build-backend = "hatchling.build"

# Project metadata.
[project]
name = "py-arguments"
description = "Build CLIs with reusable argparse parser classes."
requires-python = ">=3.8"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Matheus Oliveira de Souza" }]
dynamic = ["version"]
keywords = ["argparse", "cli", "command-line", "subcommands"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/SmilingTech/pyarg"
Repository = "https://github.com/SmilingTech/pyarg"
Issues = "https://github.com/SmilingTech/pyarg/issues"
Changelog = "https://github.com/SmilingTech/pyarg/blob/main/CHANGELOG.md"

# Dependencies.
[project.optional-dependencies]
development = [
    "pre-commit",
    "pytest"
]

[tool.hatch.build.targets.wheel]
packages = ["pyarg"]

# Version comes from the git tag created by semantic-release.
[tool.hatch.version]
source = "vcs"

# Ruff.
[tool.ruff]
target-version = "py38"
line-length = 120

[tool.ruff.lint]
select = [
    "E",  # All pycodestyle errors
    "F",   # Pyflakes
    "I",  # All isort errors
    "B",  # All flake8-bugbear errors
    "C4",  # flake8-comprehensions
    "UP",  # All pyupgrade errors
    "SIM", # flake8-simplify
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# Mypy.
[tool.mypy]
python_version = "3.8"
mypy_path = "."
strict = true
ignore_missing_imports = true
explicit_package_bases = true
disallow_untyped_decorators = false
disallow_subclassing_any = false
